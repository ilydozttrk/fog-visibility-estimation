name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: |
          pip install flask pillow numpy pandas scipy matplotlib openpyxl pytest

      - name: Run tests
        run: pytest -q

      - name: Verify public statistics without replacing the full research report
        run: python -m src.evaluation.statistical_analysis --no-figure --output-dir results/ci_statistics
